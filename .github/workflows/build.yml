name: Build Windows App

# Builds only for a release. A tagged push produces exactly one run; ordinary
# commits and pull requests do not build, since the installer is only ever
# needed when a version is published.
on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v2.7.2
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No GH_TOKEN here on purpose: with a token present on a tag build,
      # electron-builder publishes the artifacts itself, and the release step
      # below then uploads the same files again under differently sanitised
      # names. Uploading is the release step's job alone.
      - name: Build Electron app
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SurfaceExpert-Windows
          path: |
            dist/*.exe
          # The installer is ~174 MB. Actions storage is metered in GB-hours
          # against a 500 MB account-wide allowance shared by every repository,
          # so a long retention here blocks uploads elsewhere. Tagged releases
          # are the durable copy; this artifact only needs to outlive the run.
          retention-days: 3

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
