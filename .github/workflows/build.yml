name: Build Windows App

# Builds only for a release. A tagged push produces exactly one run; ordinary
# commits and pull requests do not build, since the installer is only ever
# needed when a version is published.
on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v2.7.2
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No GH_TOKEN here on purpose: with a token present on a tag build,
      # electron-builder publishes the artifacts itself, and the release step
      # below then uploads the same files again under differently sanitised
      # names. Uploading is the release step's job alone.
      - name: Build Electron app
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # No build artifact is uploaded. Every run here is a tagged release, so
      # the release assets below are already the durable copy; a second copy of
      # a ~174 MB installer only eats into the 500 MB account-wide Actions
      # storage allowance shared by every repository.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
